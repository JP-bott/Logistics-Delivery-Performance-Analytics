name: Validate NexRoute
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate synthetic dataset
        run: python scripts/generate_data.py && python scripts/load_database.py
      - name: Check analysis modules and data
        run: python -m pytest tests -q
      - name: Compile Python source
        run: python -m compileall -q app.py src scripts
